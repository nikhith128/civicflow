<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicFlow - Track a report</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>CivicFlow</h1>
    <p>Track your report</p>
  </header>
  <main class="container">
    <form id="track-form">
      <label for="rid">Report ID</label>
      <input id="rid" type="text" placeholder="e.g. CF-0041" maxlength="12" autocomplete="off">
      <button type="submit">Track</button>
    </form>
    <p id="error" class="error" hidden></p>
    <section id="result" class="card" hidden></section>
    <p class="hint"><a href="/">Report a new problem</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
