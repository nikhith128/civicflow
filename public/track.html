<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicFlow - Track a report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>CivicFlow</h1>
    <p>Enter your report ID to see where it stands.</p>
  </header>
  <main class="container">
    <section class="page-intro">
      <span class="eyebrow">REPORT UPDATES</span>
      <h2>Track a report</h2>
      <p>Enter the ID you received after submitting a report.</p>
    </section>
    <form id="track-form">
      <label for="rid">Report ID</label>
      <input id="rid" type="text" placeholder="CF-0041" maxlength="12" autocomplete="off" aria-describedby="rid-help">
      <p id="rid-help" class="hint">Your ID looks like CF-0041.</p>
      <button type="submit">Find my report</button>
    </form>
    <p id="error" class="error" hidden></p>
    <section id="result" class="card" hidden></section>
    <p class="track-link"><a href="/">← Report a new problem</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
