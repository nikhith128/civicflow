<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicFlow - Report a problem</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>CivicFlow</h1>
  </header>

  <main class="container">
    <section class="hero" aria-label="Introduction">
      <h2>See something broken? Tell us in a minute.</h2>
      <p>Drop a pin on the map. We rank what is urgent, and you can follow the fix.</p>
      <svg viewBox="0 0 400 96" role="img" aria-label="City skyline with a streetlight">
        <rect x="0" y="86" width="400" height="10" fill="#123A34"/>
        <rect x="14" y="44" width="46" height="46" rx="3" fill="#2A6A5F"/>
        <rect x="68" y="28" width="38" height="62" rx="3" fill="#3A7D70"/>
        <rect x="114" y="52" width="52" height="38" rx="3" fill="#2A6A5F"/>
        <rect x="236" y="36" width="44" height="54" rx="3" fill="#3A7D70"/>
        <rect x="288" y="20" width="36" height="70" rx="3" fill="#2A6A5F"/>
        <rect x="332" y="48" width="54" height="42" rx="3" fill="#3A7D70"/>
        <g fill="#8FC4B6" opacity=".7">
          <rect x="22" y="52" width="7" height="7"/><rect x="38" y="52" width="7" height="7"/><rect x="22" y="68" width="7" height="7"/>
          <rect x="76" y="38" width="7" height="7"/><rect x="90" y="38" width="7" height="7"/><rect x="76" y="56" width="7" height="7"/><rect x="90" y="74" width="7" height="7"/>
          <rect x="124" y="60" width="7" height="7"/><rect x="144" y="60" width="7" height="7"/>
          <rect x="246" y="46" width="7" height="7"/><rect x="262" y="64" width="7" height="7"/>
          <rect x="296" y="30" width="7" height="7"/><rect x="308" y="48" width="7" height="7"/><rect x="296" y="66" width="7" height="7"/>
          <rect x="342" y="56" width="7" height="7"/><rect x="364" y="72" width="7" height="7"/>
        </g>
        <rect x="197" y="30" width="4" height="58" fill="#0E2C27"/>
        <path d="M199 32 q-12 0 -16 8" stroke="#0E2C27" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle class="glow" cx="183" cy="43" r="14" fill="#F2C230" opacity=".35"/>
        <circle cx="183" cy="42" r="5" fill="#F2C230"/>
      </svg>
    </section>

    <form id="report-form" novalidate>
      <label for="description">What is the problem?</label>
      <textarea id="description" rows="4" maxlength="1000" placeholder="e.g. Deep pothole near the school gate"></textarea>

      <label for="photo">Photo (optional)</label>
      <input id="photo" type="file" accept="image/*">
      <p class="hint">JPG, PNG or WebP, up to 5 MB.</p>

      <label for="category">Category</label>
      <select id="category">
        <option value="not_sure">Not sure</option>
        <option value="road_damage">Road damage</option>
        <option value="waterlogging">Waterlogging</option>
        <option value="garbage">Garbage</option>
        <option value="streetlight">Streetlight</option>
        <option value="drainage">Drainage</option>
        <option value="public_service">Public service</option>
        <option value="other">Other</option>
      </select>

      <label>Location</label>
      <button type="button" id="locate-btn" class="secondary">Use my location</button>
      <div id="map"></div>
      <p id="location-text" class="hint">Tap the map to drop a pin.</p>

      <label for="address">Landmark or address (optional)</label>
      <input id="address" type="text" maxlength="200" placeholder="e.g. Near the bus stop">

      <p id="error" class="error" hidden></p>
      <button type="submit" id="submit-btn">Submit report</button>
    </form>

    <section id="result" class="card" hidden>
      <h2>Report received</h2>
      <p>Your report ID is <strong id="result-id"></strong></p>
      <p>Save this ID to follow progress.</p>
      <p><a id="track-link" href="#">Track this report</a></p>
      <div id="result-ai"></div>
      <button type="button" id="another-btn" class="secondary">Report another problem</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
